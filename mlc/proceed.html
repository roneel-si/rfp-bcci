<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Indian Premier League</title>

    <link rel="stylesheet" href="/mlc/assets/css/styles.css?v=1.2" />
</head>

<body class="welcome-page">
    <main class="welcome-shell">
        <div class="welcome-hero">
            <img src="/mlc/assets/images/banner/login-banner.png" alt="MLC logo" class="mlc-logo" />
        </div>

        <div class="login-panel">
            <div class="login-main-content">
                <!-- Login Banner Image -->

                <!-- Login Form Section -->
                <div class="login-form-section">
                                    <div class="login-title">
                    Complete <br> Your Profile
                </div>
                    <form class="login-form login-registration-form">
                        <div class="login-input-group">
                            <label class="login-input-label">First Name <span class="imp">*</span></label>
                            <input type="text" class="login-input" placeholder="Enter your first name" value="Nitesh">
                        </div>
                        <div class="login-input-group">
                            <label class="login-input-label">Last Name <span class="imp">*</span></label>
                            <input type="text" class="login-input" placeholder="Enter your last name" value="Dambe">
                        </div>

                        <div class="login-input-group">
                            <label class="login-input-label">DOB </label>
                            <input type="date" class="login-input login-date-input" value="1997-01-01"
                                placeholder="Select your date of birth">
                        </div>

                        <div class="login-input-group">
                            <label class="login-input-label">Mobile No.</label>
                            <input type="text" class="login-input mob-submit" placeholder="Enter your last name" value="9859846521">
                        </div>

                        <div class="login-input-group">
                            <label class="login-input-label">Country <span class="imp">*</span></label>
                            <div class="login-custom-dropdown login-country-dropdown">
                                <div class="login-dropdown-selected">
                                    <span class="login-selected-text">India</span>
                                    <svg class="login-dropdown-arrow" width="25" height="25" viewBox="0 0 24 24"
                                        fill="currentColor">
                                        <path
                                            d="M8.12 9.29L12 13.17l3.88-3.88c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41L12.7 15.29c-.39.39-1.02.39-1.41 0L6.7 10.7c-.39-.39-.39-1.02 0-1.41.39-.39 1.03-.39 1.42 0z">
                                        </path>
                                    </svg>
                                </div>
                                <div class="login-dropdown-options">
                                    <div class="login-dropdown-option" data-value="india">India</div>
                                    <div class="login-dropdown-option" data-value="usa">United States</div>
                                    <div class="login-dropdown-option" data-value="uk">United Kingdom</div>
                                    <div class="login-dropdown-option" data-value="australia">Australia</div>
                                    <div class="login-dropdown-option" data-value="canada">Canada</div>
                                </div>
                            </div>
                        </div>

                        <div class="login-input-group">
                            <label class="login-input-label">City <span class="imp">*</span></label>
                            <div class="login-custom-dropdown login-city-dropdown">
                                <div class="login-dropdown-selected">
                                    <span class="login-selected-text">Mumbai</span>
                                    <svg class="login-dropdown-arrow" width="25" height="25" viewBox="0 0 24 24"
                                        fill="currentColor"><button class="otp-verify-btn" onclick="window.location.href='/bcci/login-form.html'">Verify &amp;
                    Proceed</button>
                                        <path
                                            d="M8.12 9.29L12 13.17l3.88-3.88c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41L12.7 15.29c-.39.39-1.02.39-1.41 0L6.7 10.7c-.39-.39-.39-1.02 0-1.41.39-.39 1.03-.39 1.42 0z">
                                        </path>
                                    </svg>
                                </div>
                                <div class="login-dropdown-options">
                                    <div class="login-dropdown-option" data-value="mumbai">Mumbai</div>
                                    <div class="login-dropdown-option" data-value="delhi">Delhi</div>
                                    <div class="login-dropdown-option" data-value="bangalore">Bangalore</div>
                                    <div class="login-dropdown-option" data-value="chennai">Chennai</div>
                                    <div class="login-dropdown-option" data-value="kolkata">Kolkata</div>
                                    <div class="login-dropdown-option" data-value="hyderabad">Hyderabad</div>
                                </div>
                            </div>
                        </div>

                    </form>
                                           <button class="otp-verify-btn" onclick="window.location.href='/bcci/login-form.html'">Verify &amp;
                    Proceed</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
