    <script>
        // Main menu toggle
        const toggleBtn = document.getElementById("header-menu-toggle");
        const menu = document.getElementById("header-mobile-menu");
        
        toggleBtn.onclick = () => {
          const isOpen = menu.classList.toggle("header-open");
          toggleBtn.classList.toggle("header-active", isOpen);
          document.body.style.overflow = isOpen ? "hidden" : " ";
        };
        
        // Generic submenu toggle
        document.querySelectorAll(".header-submenu-header").forEach((header) => {
          header.addEventListener("click", () => {
            const submenu = header.nextElementSibling;
            const arrow = header.querySelector(".header-arrow");
            const isOpen = submenu.classList.toggle("header-submenu-open");
            arrow.classList.toggle("header-rotate", isOpen);
          });
        });

    </script>
