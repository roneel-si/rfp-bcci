  <script>
      // Main menu toggle (updated for new header markup)
      (function () {
        const toggleBtn = document.getElementById("header-menu-toggle");
        const menu = document.getElementById("header-mobile-menu");
        if (!toggleBtn || !menu) return;

        const openMenu = () => {
          if (menu.classList.contains("header-open")) return;
          menu.classList.add("header-open");
          toggleBtn.classList.add("header-active");
          document.documentElement.style.overflow = "hidden";
          document.body.style.overflow = "hidden";
          document.addEventListener("keydown", onEsc, { once: true });
          document.addEventListener("click", onOutsideClick);
          menu.querySelectorAll("a").forEach((a) => a.addEventListener("click", closeMenu, { once: true }));
        };

        const closeMenu = () => {
          menu.classList.remove("header-open");
          toggleBtn.classList.remove("header-active");
          document.documentElement.style.overflow = "";
          document.body.style.overflow = "";
          document.removeEventListener("click", onOutsideClick);
        };

        const onEsc = (e) => {
          if (e.key === "Escape") closeMenu();
        };

        const onOutsideClick = (e) => {
          if (menu.contains(e.target) || toggleBtn.contains(e.target)) return;
          closeMenu();
        };

        toggleBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (menu.classList.contains("header-open")) {
            closeMenu();
          } else {
            openMenu();
          }
        });
      })();
      
      // Generic submenu toggle
      document.querySelectorAll(".header-submenu-header").forEach((header) => {
        header.addEventListener("click", () => {
          const submenu = header.nextElementSibling;
          const arrow = header.querySelector(".header-arrow");
          const isOpen = submenu.classList.toggle("header-submenu-open");
          arrow.classList.toggle("header-rotate", isOpen);
        });
      });
  </script>
