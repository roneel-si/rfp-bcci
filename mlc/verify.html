<body class="welcome-page">
    <main class="welcome-shell">
        <div class="welcome-hero">
            <img src="/mlc/assets/images/banner/login-banner.png" alt="MLC logo" class="mlc-logo" />
        </div>

        <div class="otp-container">
            <div class="otp-header">
                <h1 class="otp-title">OTP <br> VERIFICATION</h1>
                <p class="otp-subtitle">Enter the OTP sent to 9859846521. Be careful not to share the code with anyone.
                </p>
            </div>

            <div class="otp-form">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-input" value="4">
                    <input type="text" maxlength="1" class="otp-input" value="4">
                    <input type="text" maxlength="1" class="otp-input" value="5">
                    <input type="text" maxlength="1" class="otp-input" value="5">
                    <input type="text" maxlength="1" class="otp-input" value="1">
                    <input type="text" maxlength="1" class="otp-input" value="2">

                </div>

                <div class="otp-resend">
                    <p class="resend-text">Didn't receive the OTP? <span class="resend-link">Resend OTP</span></p>
                    <p class="timer-text">Time remaining: 20 sec</p>
                </div>

                <div class="otp-terms">
                    <div class="terms-item">
                        <input type="checkbox" id="terms2" class="terms-checkbox">
                        <label for="terms2" class="terms-label">Disclaimer: Your information may be used by MLC and made
                            available to our sponsors and third-parties to provide you with news and promotional
                            information about MLC. For further information, please consult our Online <span
                                class="terms-link">Privacy Policy</span>.</label>
                    </div>
                    <div class="terms-item">
                        <input type="checkbox" id="terms1" class="terms-checkbox">
                        <label for="terms1" class="terms-label">I acknowledge that I have read and agree to the <span
                                class="terms-link">Terms Of Services</span> and <span class="terms-link">Privacy
                                Policy</span>.</label>
                    </div>
                </div>

                <button class="otp-verify-btn" onclick="window.location.href='/bcci/login-form.html'">Verify &
                    Proceed</button>
            </div>
        </div>
    </main>
</body>

</html>
